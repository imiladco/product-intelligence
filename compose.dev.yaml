# Local development: only PostgreSQL runs in Docker.
# The API and web apps run on the host for fast reloads.
#
#   docker compose -f compose.dev.yaml up -d
#
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-product_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
