# Build once, publish, deploy staging. Runs only after CI has passed on main.
#
# Two jobs, deliberately separated by a readiness gate.
#
#   publish  — always runs on a green CI. Builds both images, pushes them, and
#              proves the provenance chain. This is a quality gate: it must be
#              exercised on every commit to main, long before any server
#              exists, so that a broken Dockerfile or a broken provenance chain
#              is caught here rather than during infrastructure bootstrap.
#
#   deploy   — runs only when the repository variable STAGING_DEPLOY_READY is
#              exactly "true". Until the staging host has been bootstrapped and
#              its control plane installed, there is nothing to deploy to, and
#              an attempt would fail on a missing SSH secret with an error that
#              says nothing about the real reason.
#
# The gate is a repository *variable*, not a secret and not a file in this
# tree. That matters: a variable is set by a human with repository admin
# rights, outside the merge path, so arming the deploy is a deliberate act in
# repository settings rather than something a merged commit can do. It is the
# same principle the server-side control plane follows — the thing that
# authorises deployment is not modifiable by the automatic path it authorises.
#
# It is fail-closed by absence. Unset, misspelled or set to anything other than
# "true" all mean not ready. There is no default that arms it.
#
# This is still the only workflow permitted to write packages, and the only one
# that reaches the staging server. It sends release DATA — a SHA and two
# digests — over a forced SSH command. It cannot install a script, a manifest
# or a key on that host; the control plane is installed by a human with root,
# from a reviewed commit, and nothing here can change it.
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  # One staging deploy at a time. The server also holds a lock, but queuing
  # here keeps the workflow log honest about what is waiting.
  group: deploy-staging
  cancel-in-progress: false

jobs:
  publish:
    # A red gate publishes nothing and deploys nothing.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the migration compatibility declaration
        id: metadata
        run: |
          COMPAT="$(python3 -c "import json;print(str(json.load(open('deploy/release-metadata.json'))['migrations_backward_compatible']).lower())")"
          echo "compat=${COMPAT}" >> "$GITHUB_OUTPUT"

      # Tagged by the full commit SHA for human lookup. Nothing deploys by that
      # tag: the digests below are the deployment identity.
      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/imiladco/product-intelligence/api:${{ github.event.workflow_run.head_sha }}
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
            MIGRATIONS_BACKWARD_COMPATIBLE=${{ steps.metadata.outputs.compat }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/imiladco/product-intelligence/web:${{ github.event.workflow_run.head_sha }}
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest half of the chain, and the only place it can be established:
      # pull the digest the build step reported — proving it is real and
      # fetchable, not merely announced — then verify the labels on that digest
      # reference rather than on a tag, which could have moved.
      - name: Verify artifact provenance by digest
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          COMPAT: ${{ steps.metadata.outputs.compat }}
        run: |
          API_REF="ghcr.io/imiladco/product-intelligence/api@${API_DIGEST}"
          WEB_REF="ghcr.io/imiladco/product-intelligence/web@${WEB_DIGEST}"

          docker pull "$API_REF"
          docker pull "$WEB_REF"

          deploy/scripts/verify-image-provenance.sh "$API_REF" "$SHA" "$COMPAT"
          deploy/scripts/verify-image-provenance.sh "$WEB_REF" "$SHA"

          # The digest the build reported must be the digest the registry
          # actually stores for what we just pulled.
          for ref in "$API_REF" "$WEB_REF"; do
            stored="$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref")"
            case "$stored" in
              *"@${ref##*@}") ;;
              *) echo "digest mismatch: reported ${ref##*@}, stored ${stored}" >&2; exit 1 ;;
            esac
          done

      # Says, in the run itself, whether a deploy follows and why. A skipped
      # job with no explanation is the "silent failure" this gate exists to
      # avoid: someone reading the run should not have to guess whether staging
      # was deployed, or infer it from the absence of a job.
      - name: Report the staging deployment readiness gate
        env:
          READY: ${{ vars.STAGING_DEPLOY_READY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "### Staging deployment readiness"
            echo
            echo "Images for \`${SHA}\` were built, pushed and provenance-verified."
            echo
            if [ "$READY" = "true" ]; then
              echo "\`STAGING_DEPLOY_READY\` is \`true\` — the deploy job will run."
            else
              echo "\`STAGING_DEPLOY_READY\` is not \`true\` — **the deploy job is skipped**."
              echo
              echo "This is expected until the staging host has been bootstrapped."
              echo "Nothing failed. The images are published and usable."
              echo
              echo "To arm staging deployment, once the host and its control"
              echo "plane exist and the deploy secrets are configured, set the"
              echo "repository variable \`STAGING_DEPLOY_READY\` to \`true\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    # Two conditions, both required, both fail-closed.
    #
    # `needs.publish.result == 'success'` is redundant under GitHub's default
    # semantics — a job whose dependency failed or was skipped is skipped too.
    # It is stated anyway because that default is silently lost the moment a
    # job-level `if` uses always(), failure() or cancelled(): the job would
    # then run on a *failed* publish, deploying images whose provenance was
    # never verified. Written out, the requirement survives such an edit, and
    # a test rejects job-level status functions here so the edit is caught.
    #
    # The readiness gate itself admits exactly "true". Unset, empty, "TRUE"
    # and "yes" all leave this job unrun; no value defaults it on.
    if: ${{ needs.publish.result == 'success' && vars.STAGING_DEPLOY_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Setting the variable does not conjure the secrets. Checked here so the
      # failure names what is actually missing, rather than surfacing as an
      # opaque ssh error against an empty host.
      - name: Verify the deploy secrets are configured
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          STAGING_DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER STAGING_DEPLOY_KEY DEPLOY_KNOWN_HOSTS; do
            # Presence only. The value is never printed, compared or logged.
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "STAGING_DEPLOY_READY is true but these secrets are not set:${missing}" >&2
            echo "Either configure them, or set STAGING_DEPLOY_READY back to false." >&2
            exit 1
          fi

      - name: Prepare SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The whole client request: a verb, a SHA and two digests. The server's
      # forced command supplies the environment, so this cannot name production
      # however it is written.
      - name: Deploy staging
        env:
          SHA: ${{ needs.publish.outputs.sha }}
          API_DIGEST: ${{ needs.publish.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.publish.outputs.web_digest }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_ed25519 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "deploy ${SHA} ${API_DIGEST} ${WEB_DIGEST}"

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
