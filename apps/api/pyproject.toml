# Tool configuration only. The API is a Django application, not a distributable
# package, so dependencies live in requirements.txt / requirements-dev.txt and
# there is no [project] table or build backend to install.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
