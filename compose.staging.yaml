# Staging deployment.
#
# Consumes images built by CI and published to private GHCR; it never builds.
# The deploy script writes .release/images.env with the exact digests it pulled
# and passes it through, so API_IMAGE and WEB_IMAGE are always
# `…@sha256:…` references and never mutable tags.
#
#   docker compose -f compose.staging.yaml up -d
#
# Never pass -p, and never set COMPOSE_PROJECT_NAME: both override the `name:`
# key below, and every volume lookup would follow them to a project that does
# not exist. The deploy script unsets the variable and asserts the resolved
# name before it touches anything.
#
# Postgres is on the internal network only. It is unreachable from the edge
# network, from the host, and from the internet.

name: product-intelligence-staging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: [.env]
    environment:
      DJANGO_STATIC_ROOT: /srv/static
      # Reported by /api/health so the deploy gate can prove this host serves
      # the release it was just given.
      RELEASE_SHA: ${RELEASE_SHA}
    volumes:
      # Shared with the proxy, which serves /static/ so Django does not have to.
      - static:/srv/static
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      # 45s, down from the 120s that covered collectstatic and migrations on
      # every start. Those are an explicit release step now, so startup is just
      # gunicorn coming up.
      start_period: 45s
    networks:
      internal:
      edge:
        # Explicit, because shared Caddy joins both edge networks and a bare
        # `api` would be ambiguous across environments.
        aliases: [staging-api]

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      # Server-side rendering talks to the API over the INTERNAL network, using
      # the plain service name. Not the edge alias: that would require
      # DJANGO_ALLOWED_HOSTS to carry `staging-api` too, and forgetting it
      # returns 400 DisallowedHost with sign-in failing silently.
      INTERNAL_API_BASE_URL: http://api:8000
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # busybox wget: the node:alpine image has no curl.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      internal:
      edge:
        aliases: [staging-web]

# Every volume is external and pinned to the exact name that already exists on
# the server. An external volume that is missing is a hard error, so there is
# no path where a drifted name silently produces an empty database.
#
# The legacy names are kept deliberately. `pgdata_staging` inside a project
# called `product-intelligence-staging` yields the doubled
# `product-intelligence-staging_pgdata_staging`; renaming the key to `pgdata`
# would point at a different volume, and renaming the volume would mean copying
# a live database for cosmetics.
volumes:
  pgdata_staging:
    external: true
    name: product-intelligence-staging_pgdata_staging
  static:
    external: true
    name: product-intelligence-staging_static

# External too, created once by the storage skeleton. A deployment can never
# invent a network by accident.
networks:
  internal:
    external: true
    name: product-intelligence-staging-internal
  edge:
    external: true
    name: product-intelligence-staging-edge
